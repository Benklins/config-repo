# Shared Zipkin configuration for all services
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.otlp.tracing.endpoint=http://localhost:9411/v1/traces

# Common Actuator settings
management.endpoints.web.exposure.include=health,info,metrics,tracing
management.endpoint.health.show-details=always

# Enable distributed tracing
management.observations.enabled=true
management.tracing.enabled=true

# Feign client default config
feign.client.config.default.logger-level=basic
