spring.application.name=stock-service

# Consul configuration
spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.cloud.consul.discovery.prefer-ip-address=false
spring.cloud.consul.discovery.hostname=localhost
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.value}
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=15s

# Tracing configuration
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.opentelemetry.resource-attributes.service.name=${spring.application.name}

# Zipkin exporter
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.otlp.tracing.endpoint=http://localhost:9411/v1/traces

# Expose tracing endpoints
management.endpoints.web.exposure.include=health,info,metrics,tracing
management.endpoint.health.show-details=always

# Feign configuration
feign.client.config.default.logger-level=basic

# NOTE: Each instance will override server.port in its own bootstrap.yml
